name: checks

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    # weekly, to catch external link rot between pushes
    - cron: "0 9 * * 1"

jobs:
  html:
    name: validate html
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npx --yes htmlhint "**/*.html"

  links:
    name: check links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: lycheeverse/lychee-action@v2
        with:
          # LinkedIn returns 999 to any non-browser client, so it can't be checked.
          args: >-
            --no-progress
            --exclude 'linkedin\.com'
            './**/*.html'
          fail: true
