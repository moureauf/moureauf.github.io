<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Writing · François Moureau</title>
  <meta name="description" content="Notes on developer tooling and personal knowledge management, from François Moureau.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23EEECE4'/%3E%3Ctext x='16' y='23' font-family='Georgia,serif' font-size='22' fill='%23A8431B' text-anchor='middle'%3EF%3C/text%3E%3C/svg%3E">
  <link rel="preload" href="../fonts/Inter-Variable.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="../fonts/JetBrainsMono-Variable.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
  <div class="wrap">
    <div class="top">
      <span class="mark">FM · London</span>
      <button class="toggle" id="themeToggle" type="button" aria-label="Switch colour theme">theme</button>
    </div>

    <header>
      <h1 class="reveal">Writing</h1>
      <p class="tagline reveal">Notes on developer tooling and personal knowledge management.</p>
      <div class="rule" aria-hidden="true"></div>
    </header>

    <section>
      <p class="eyebrow">posts</p>
      <p class="desc">Coming soon.</p>
    </section>

    <footer>
      <nav>
        <a href="../">home</a>
        <a href="https://github.com/moureauf">github</a>
      </nav>
      <span class="colophon">built plainly · updated Jul 2026</span>
    </footer>
  </div>

  <script>
    (function () {
      var root = document.documentElement;
      var btn = document.getElementById('themeToggle');
      var stored = null;
      try { stored = localStorage.getItem('theme'); } catch (e) {}
      if (stored === 'dark' || stored === 'light') root.setAttribute('data-theme', stored);
      btn.addEventListener('click', function () {
        var cur = root.getAttribute('data-theme');
        if (!cur) {
          cur = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        var next = cur === 'dark' ? 'light' : 'dark';
        root.setAttribute('data-theme', next);
        try { localStorage.setItem('theme', next); } catch (e) {}
      });
    })();
  </script>
</body>
</html>
