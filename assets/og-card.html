<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  @font-face {
    font-family: "Inter Var";
    src: url("../fonts/Inter-Variable.woff2") format("woff2");
    font-weight: 100 900;
  }
  @font-face {
    font-family: "JetBrains Mono Var";
    src: url("../fonts/JetBrainsMono-Variable.woff2") format("woff2");
    font-weight: 100 800;
  }
  * { margin: 0; box-sizing: border-box; }
  html { background: #EEECE4; overflow: hidden; }
  body {
    width: 1200px; height: 630px;
    background: #EEECE4; color: #1B1913;
    font-family: "Inter Var", sans-serif;
    display: flex; flex-direction: column; justify-content: space-between;
    padding: 88px 96px 80px;
  }
  .content { flex: 1; display: flex; flex-direction: column; justify-content: center; }
  h1 {
    font-size: 108px; font-weight: 600; letter-spacing: -0.025em; line-height: 1.02;
  }
  .tagline {
    font-size: 38px; color: #6C6656; letter-spacing: -0.01em; margin-top: 26px;
  }
  .rule {
    height: 5px; border-radius: 5px; margin-top: 54px;
    background: linear-gradient(to right, #A8431B 0, #A8431B 128px, #D9D5C8 128px, #D9D5C8 100%);
  }
  .url {
    font-family: "JetBrains Mono Var", monospace;
    font-size: 24px; color: #A8431B; letter-spacing: 0.04em;
  }
</style>
</head>
<body>
  <div class="content">
    <h1>François Moureau</h1>
    <p class="tagline">Software engineer in London.</p>
    <div class="rule"></div>
  </div>
  <div class="url">francoismoureau.com</div>
</body>
</html>
