<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>per-post og.png source — screenshot at 1200×630</title>
<style>
  @font-face {
    font-family: "Inter Var";
    src: url("../fonts/Inter-Variable.woff2") format("woff2");
    font-weight: 100 900;
  }
  @font-face {
    font-family: "JetBrains Mono Var";
    src: url("../fonts/JetBrainsMono-Variable.woff2") format("woff2");
    font-weight: 100 800;
  }
  * { margin: 0; box-sizing: border-box; }
  html { background: #EEECE4; overflow: hidden; }
  body {
    width: 1200px; height: 630px;
    background: #EEECE4; color: #1B1913;
    font-family: "Inter Var", sans-serif;
    display: flex; flex-direction: column; justify-content: space-between;
    padding: 88px 96px 80px;
  }
  .content { flex: 1; display: flex; flex-direction: column; justify-content: center; }
  .eyebrow {
    font-family: "JetBrains Mono Var", monospace;
    font-size: 24px; letter-spacing: 0.16em; text-transform: uppercase;
    color: #6C6656; margin-bottom: 30px;
  }
  h1 {
    font-size: 92px; font-weight: 600; letter-spacing: -0.025em; line-height: 1.05;
    text-wrap: balance;
  }
  .rule {
    height: 5px; border-radius: 5px; margin-top: 54px;
    background: linear-gradient(to right, #A8431B 0, #A8431B 128px, #D9D5C8 128px, #D9D5C8 100%);
  }
  .footer-row {
    display: flex; justify-content: space-between; align-items: baseline;
    font-family: "JetBrains Mono Var", monospace; font-size: 24px; letter-spacing: 0.04em;
  }
  .url { color: #A8431B; }
  .author { color: #6C6656; }
</style>
</head>
<body>
  <div class="content">
    <p class="eyebrow" id="eyebrow">writing</p>
    <h1 id="title">Post title</h1>
    <div class="rule"></div>
  </div>
  <div class="footer-row">
    <span class="url" id="url">francoismoureau.com/writing</span>
    <span class="author">François Moureau</span>
  </div>
  <script>
    // Fill from query params so one template serves every post, e.g.:
    // og-card-post.html?title=Life+in+a+repo&date=july+2026&path=writing/life-in-a-repo
    (function () {
      var p = new URLSearchParams(location.search);
      if (p.get('title')) document.getElementById('title').textContent = p.get('title');
      if (p.get('date')) document.getElementById('eyebrow').textContent = 'writing — ' + p.get('date');
      if (p.get('path')) document.getElementById('url').textContent = 'francoismoureau.com/' + p.get('path').replace(/^\/|\/$/g, '');
    })();
  </script>
</body>
</html>
