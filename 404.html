  <link rel="preload" href="fonts/JetBrainsMono-Variable.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="wrap">
    <div class="top">
      <span class="mark">FM · London</span>
      <button class="toggle" id="themeToggle" type="button" aria-label="Switch colour theme">theme</button>
    </div>

    <header>
      <h1 class="reveal">Not found</h1>
      <p class="tagline reveal">That page doesn't exist.</p>
      <div class="rule" aria-hidden="true"></div>
      <p class="links"><a href="/">← back to the homepage</a></p>
    </header>
  </div>

  <script>
    (function () {
      var root = document.documentElement;
      var btn = document.getElementById('themeToggle');
      var stored = null;
      try { stored = localStorage.getItem('theme'); } catch (e) {}
      if (stored === 'dark' || stored === 'light') root.setAttribute('data-theme', stored);
      btn.addEventListener('click', function () {
        var cur = root.getAttribute('data-theme');
        if (!cur) {
          cur = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        var next = cur === 'dark' ? 'light' : 'dark';
        root.setAttribute('data-theme', next);
        try { localStorage.setItem('theme', next); } catch (e) {}
      });
    })();
  </script>
